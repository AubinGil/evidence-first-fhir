[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-fhir"
version = "0.1.0"
description = "Evidence-first, human-approved clinical document to FHIR reference pipeline"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/AubinGil/evidence-first-fhir"
Repository = "https://github.com/AubinGil/evidence-first-fhir"
Issues = "https://github.com/AubinGil/evidence-first-fhir/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pipelines*", "policies*", "providers*"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_goldset.py"]
pythonpath = ["."]
