[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-fhir-agent"
version = "0.1.0"
description = "Evidence-first, human-approved clinical document to FHIR reference pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_goldset.py"]
pythonpath = ["."]
